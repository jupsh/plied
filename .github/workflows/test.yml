name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cargo test
      - name: Replay the worked research example
        if: runner.os == 'Linux'
        run: python3 examples/research/replay.py --plied "$PWD/target/debug/plied"
  msrv:
    # the rust-version Cargo.toml declares
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cargo test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      # the pdf feature is never built by the test jobs
      - run: cargo clippy --all-targets --features pdf -- -D warnings

