name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cargo test
      - name: Replay the worked research example
        if: runner.os == 'Linux'
        run: python3 examples/research/replay.py --plied "$PWD/target/debug/plied"
      - name: Replay the first-task onboarding workflow
        if: runner.os == 'Linux'
        run: python3 examples/first-task/replay.py --plied "$PWD/target/debug/plied"
      - name: Replay scope decisions and check the optional retrieval companion
        if: runner.os == 'Linux'
        run: |
          python3 examples/scope/replay.py --plied "$PWD/target/debug/plied"
          cargo test --locked --example related
          cargo build --locked --example related
          python3 examples/related/test_related.py --plied "$PWD/target/debug/plied" --related "$PWD/target/debug/examples/related"
          python3 examples/reconcile/test_reconcile.py --plied "$PWD/target/debug/plied"
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pdfium for the extraction smoke test
        run: python3 -m pip install --target "$RUNNER_TEMP/pdfium" pypdfium2==5.14.0
      - name: Extract and use a real PDF with the default Git page cache
        run: LD_LIBRARY_PATH="$RUNNER_TEMP/pdfium/pypdfium2_raw" cargo test --locked --features pdf --test pdf_cache
  msrv:
    # the rust-version Cargo.toml declares
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cargo test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      # the pdf feature is never built by the test jobs
      - run: cargo clippy --all-targets --features pdf -- -D warnings

