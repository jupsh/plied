[package]
name = "plied"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
description = "A git-tracked work record for teams of agents and people: a work tree, commitments, open questions, messages to whoever is on a node, and checked citations of cleared literature."
license = "MIT"
authors = ["jupsh"]
readme = "README.md"
homepage = "https://github.com/jupsh/plied"
repository = "https://github.com/jupsh/plied"
keywords = ["agents", "multi-agent", "provenance", "git", "literature"]
categories = ["command-line-utilities", "science", "development-tools"]
include = ["src/**/*", "tests/**/*", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
name = "plied"
path = "src/lib.rs"

[[bin]]
name = "plied"
path = "src/main.rs"

[features]
default = []
# PDF page text (`plied lit extract`) and page images through pdfium, loaded at run time
pdf = ["dep:pdfium-render", "dep:image"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dunce = "1"
fancy-regex = "0.14"
getrandom = "0.2"
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
unicode-normalization = "0.1"
pdfium-render = { version = "0.8", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
